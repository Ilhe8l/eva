services:
  eva:
    build:
      context: .
      args:
        EVA_EXTRAS: ${EVA_EXTRAS:---extra test}
    user: ${EVA_UID:-1000}:${EVA_GID:-1000}
    working_dir: /workspace
    network_mode: host
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      EVA_PROJECT_ROOT: /workspace
    volumes:
      - .:/workspace
