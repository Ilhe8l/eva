[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva"
version = "0.3.0"
description = "A personal voice assistant that lives on your computer, built on local AI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Souza" }]
requires-python = ">=3.12"
keywords = ["assistant", "voice", "agent", "local-ai", "langgraph", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "deepagents>=0.7.19,<1",
    "langchain>=1.4.3,<2",  # repairs malformed tool calls, which small local models emit
    "langchain-google-genai>=4.4,<5",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pillow>=12.3",  # image and video frames for multimodal read_file
    "prompt-toolkit>=3.0.50,<4",
    "python-dotenv>=1.2",
    "rich>=14",
    "textual>=8.2,<9",
]

[project.urls]
Repository = "https://github.com/Ilhe8l/eva"
Issues = "https://github.com/Ilhe8l/eva/issues"

[project.optional-dependencies]
voice = [
    "en-core-web-sm",  # English pipeline Kokoro loads at runtime
    "faster-whisper>=1.2,<2",
    "kokoro>=0.9.4,<1",
    "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'linux'",  # CTranslate2 (Whisper) is built for CUDA 12
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
]
test = ["pytest>=8,<10"]

[project.scripts]
eva = "eva.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eva"]

[dependency-groups]
dev = ["ruff>=0.13"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes
    "I",            # import order
    "UP",           # modern syntax for the target Python
    "B",            # likely bugs
    "SIM", "C4", "PIE", "RET", "FURB",  # simpler code
    "PERF",         # avoidable slowness
    "PTH",          # pathlib over os.path
    "PT",           # pytest style
    "RUF",          # ruff's own checks, including unused noqa comments
]
# A composite assert reads fine in a test and names what it checks.
ignore = ["PT018"]
# Eva's terminal prompt uses a typographic arrow on purpose.
allowed-confusables = ["›"]

[tool.ruff.lint.per-file-ignores]
# The voice tests skip themselves before importing modules that need the voice extra.
"tests/test_listening.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
