[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-local"
version = "0.1.0"
description = "Personal voice assistant with reviewed computer access and self-extension"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.19,<1",
    "langchain>=1.4,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pillow>=12.3",  # image and video frames for multimodal read_file
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
voice = [
    "en-core-web-sm",  # English pipeline Kokoro loads at runtime
    "faster-whisper>=1.2,<2",
    "kokoro>=0.9.4,<1",
    "sounddevice>=0.5,<1",
    "soundfile>=0.13,<1",
]
test = ["pytest>=8,<10"]

[project.scripts]
eva = "eva.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eva"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
